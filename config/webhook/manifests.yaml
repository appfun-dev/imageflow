---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-imageflow-appfun-dev-v1alpha1-imagestream
  failurePolicy: Fail
  name: mimagestream.kb.io
  rules:
  - apiGroups:
    - imageflow.appfun.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - imagestreams
  sideEffects: None
  timeoutSeconds: 10
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-imageflow-appfun-dev-v1alpha1-imagesubscription
  failurePolicy: Fail
  name: mimagesubscription.kb.io
  rules:
  - apiGroups:
    - imageflow.appfun.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - imagesubscriptions
  sideEffects: None
  timeoutSeconds: 10
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-imageflow-appfun-dev-v1alpha1-imagestream
  failurePolicy: Fail
  name: vimagestream.kb.io
  rules:
  - apiGroups:
    - imageflow.appfun.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - imagestreams
  sideEffects: None
  timeoutSeconds: 10
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-imageflow-appfun-dev-v1alpha1-imagesubscription
  failurePolicy: Fail
  name: vimagesubscription.kb.io
  rules:
  - apiGroups:
    - imageflow.appfun.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - imagesubscriptions
  sideEffects: None
  timeoutSeconds: 10
