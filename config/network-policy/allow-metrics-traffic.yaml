# This NetworkPolicy allows ingress traffic
# with Pods running on namespaces labeled with 'metrics: enabled'. Only Pods on those
# namespaces are able to gather data from the metrics endpoint.
#
# OPT-IN overlay (ADR-010): not part of config/default — enabling it by
# default could silently block scrapes on clusters whose monitoring namespace
# lacks the label. Activate with:
#   1. uncomment `- ../network-policy` in config/default/kustomization.yaml
#      (or `kubectl apply -k config/network-policy` alongside the install), and
#   2. label every namespace that runs a scraper:
#        kubectl label ns <monitoring-ns> metrics=enabled
#
# The port matches the v1 plaintext metrics posture (:8080, ADR-010). If you
# flip the manager to secure metrics (--metrics-secure=true on :8443 — see
# docs/ops.md §Metrics), change the port below to 8443 accordingly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: imageflow
    app.kubernetes.io/managed-by: kustomize
  name: allow-metrics-traffic
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: imageflow
  policyTypes:
    - Ingress
  ingress:
    # This allows ingress traffic from any namespace with the label metrics: enabled
    - from:
      - namespaceSelector:
          matchLabels:
            metrics: enabled  # Only from namespaces with this label
      ports:
        - port: 8080
          protocol: TCP
