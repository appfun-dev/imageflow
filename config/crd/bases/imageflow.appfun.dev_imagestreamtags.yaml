---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.15.0
  name: imagestreamtags.imageflow.appfun.dev
spec:
  group: imageflow.appfun.dev
  names:
    kind: ImageStreamTag
    listKind: ImageStreamTagList
    plural: imagestreamtags
    singular: imagestreamtag
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.stream
      name: Stream
      type: string
    - jsonPath: .spec.tag
      name: Tag
      type: string
    - jsonPath: .status.image.digest
      name: Digest
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ImageStreamTag is the read-only mirror view of one tag of an ImageStream:
          kubectl get/watch works on vanilla Kubernetes with OpenShift-aligned UX
          (ADR-002 R4). It is synthesized by the controller from ImageStream.status +
          ImageArtifact with an ownerRef to the stream (cascading GC on stream deletion,
          user story 8). spec/status are fully controller-owned; the user-writable surface
          is exactly metadata.annotations. Subscriptions reference it in the logical
          "<stream>:<tag>" colon form and never by encoded object name.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ImageStreamTagSpec identifies the mirrored stream tag. It is synthesized and
              owned by the mirror controller and immutable afterwards: the CEL transition rule
              rejects user spec writes without depending on webhook availability (ADR-002 R4,
              spec decision 6). The spec fields are authoritative; the object name is only an
              index encoded as <stream>--<tag> (RFC 1123, first "--" split is injective
              because stream names must not contain "--", webhook-enforced in T3).
            properties:
              stream:
                description: Stream is the name of the source ImageStream in the same
                  namespace.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                type: string
              tag:
                description: Tag is the tag name within the stream (OCI tag grammar).
                maxLength: 128
                minLength: 1
                pattern: ^[a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}$
                type: string
            required:
            - stream
            - tag
            type: object
            x-kubernetes-validations:
            - message: 'ImageStreamTag is a controller-owned mirror object: spec is
                immutable and user writes are rejected; only metadata.annotations
                are user-writable (ADR-002 R4)'
              rule: self == oldSelf
          status:
            description: |-
              ImageStreamTagStatus is the controller-owned mirror status (see
              MirrorObjectStatus for the write-protection model).
            properties:
              conditions:
                description: Conditions of the mirror object, keyed by type.
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              consumers:
                description: |-
                  Consumers lists the subscriptions sourcing this stream tag / digest.
                  Capped by MirrorConsumerMaxItems as a structural etcd guard (ADR-002 R4
                  requires bounded enrichment without naming a number).
                items:
                  description: |-
                    ConsumerReference names a subscription that consumes the mirrored stream tag or
                    digest as its source ("who consumed this", user story 39).
                  properties:
                    name:
                      description: Name of the consuming subscription.
                      maxLength: 253
                      minLength: 1
                      type: string
                    namespace:
                      description: Namespace of the consuming subscription.
                      maxLength: 63
                      minLength: 1
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                maxItems: 50
                type: array
                x-kubernetes-list-type: atomic
              events:
                description: |-
                  Events is the bounded event summary (image changes and delivery summaries)
                  floated up from the catalog and subscription sides, most recent first.
                  Bounded to MirrorEventMaxItems (5) at CRD level (ADR-008).
                items:
                  description: |-
                    MirrorStatusEvent is one entry of the bounded event summary on mirror objects
                    (ImageStreamTag/ImageTag .status.events, cap MirrorEventMaxItems). Overflow falls
                    to kube Events and audit logs (ADR-008); the array keeps the most recent entries.
                  properties:
                    message:
                      description: Message is a human-readable summary.
                      maxLength: 2048
                      type: string
                    newDigest:
                      description: NewDigest is the newly associated digest (ImageChanged
                        events).
                      pattern: ^sha256:[0-9a-f]{64}$
                      type: string
                    observedAt:
                      description: ObservedAt is when the underlying change or delivery
                        outcome was observed.
                      format: date-time
                      type: string
                    oldDigest:
                      description: OldDigest is the previously associated digest (ImageChanged
                        events).
                      pattern: ^sha256:[0-9a-f]{64}$
                      type: string
                    reason:
                      description: Reason is a stable machine-readable reason for
                        the event.
                      maxLength: 256
                      type: string
                    result:
                      description: |-
                        Result is the delivery outcome using the RolloutStatus vocabulary,
                        including the Superseded and Conflict terminal states (Delivery events).
                      enum:
                      - Progressing
                      - Succeeded
                      - Failed
                      - Unknown
                      - Superseded
                      - Conflict
                      type: string
                    subscription:
                      description: Subscription identifies the consuming subscription
                        (Delivery events).
                      properties:
                        name:
                          description: Name of the subscription.
                          maxLength: 253
                          minLength: 1
                          type: string
                        namespace:
                          description: Namespace of the subscription.
                          maxLength: 63
                          minLength: 1
                          type: string
                      required:
                      - name
                      - namespace
                      type: object
                    target:
                      description: Target identifies the workload the delivery went
                        to (Delivery events).
                      properties:
                        apiVersion:
                          description: APIVersion of the target object, e.g. apps/v1.
                          maxLength: 256
                          minLength: 1
                          type: string
                        kind:
                          description: Kind of the target object, e.g. Deployment.
                          maxLength: 63
                          minLength: 1
                          type: string
                        name:
                          description: Name of the target object.
                          maxLength: 253
                          minLength: 1
                          type: string
                        namespace:
                          description: |-
                            Namespace of the target object. Targets may live in any namespace;
                            cross-namespace access is authorized via SubjectAccessReview (ADR-003).
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                      required:
                      - apiVersion
                      - kind
                      - name
                      - namespace
                      type: object
                    type:
                      description: 'Type of the event: ImageChanged or Delivery.'
                      enum:
                      - ImageChanged
                      - Delivery
                      type: string
                  required:
                  - observedAt
                  - type
                  type: object
                maxItems: 5
                type: array
                x-kubernetes-list-type: atomic
              image:
                description: Image is the current association synthesized from the
                  source stream.
                properties:
                  artifactRef:
                    description: |-
                      ArtifactRef is the name of the cluster-scoped ImageArtifact for this digest
                      (sha256-<64hex>).
                    maxLength: 253
                    type: string
                  created:
                    description: Created is when this association was first recorded
                      on the source stream.
                    format: date-time
                    type: string
                  digest:
                    description: Digest of the currently associated image, sha256:<64hex>.
                    pattern: ^sha256:[0-9a-f]{64}$
                    type: string
                  imageReference:
                    description: ImageReference is the canonical digest reference
                      <repo>@sha256:<64hex>.
                    pattern: ^[^@\s]+@sha256:[0-9a-f]{64}$
                    type: string
                required:
                - digest
                type: object
              observedGeneration:
                description: |-
                  ObservedGeneration is the generation of the source ImageStream last
                  synthesized into this mirror (mirror lag is seconds, ADR-002 consequences).
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
