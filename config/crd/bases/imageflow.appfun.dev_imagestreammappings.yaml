---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: imagestreammappings.imageflow.appfun.dev
spec:
  group: imageflow.appfun.dev
  names:
    kind: ImageStreamMapping
    listKind: ImageStreamMappingList
    plural: imagestreammappings
    singular: imagestreammapping
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.stream
      name: Stream
      type: string
    - jsonPath: .spec.tag
      name: Tag
      type: string
    - jsonPath: .status.conditions[?(@.type=="Complete")].status
      name: Complete
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ImageStreamMapping is a short-lived task CRD that registers an already-pushed
          image into the catalog (ADR-002 R7, ADR-004). Same lifecycle as
          ImageStreamImport: TTL GC after completion (success 1h / failure 24h,
          controller flags) and Event audit throughout. Created by CI/Tekton pipeline
          steps; quickstart ships a ready-made example (user story 17).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ImageStreamMappingSpec is the registration request (push path, ADR-004): CI
              pipelines create a Mapping after a successful BuildRun to register the built
              repo@digest onto (stream, tag). Mapping is the only v1 bridge from build output
              into the catalog.
            properties:
              image:
                description: |-
                  Image is the pushed image as a digest reference <repo>@sha256:<64hex>.
                  Tag-only references are rejected: a registration without a digest cannot
                  produce an Image Change and would poison the downstream chain (ADR-004).
                  The controller may verify the reference against the registry; caller-provided
                  metadata is not blindly trusted (ADR-002 R7).
                maxLength: 2048
                minLength: 1
                pattern: ^[^@\s]+@sha256:[0-9a-f]{64}$
                type: string
              pullSecretRef:
                description: |-
                  PullSecretRef optionally references a dockerconfigjson secret in the same
                  namespace, used when the controller verifies the image against the registry.
                  Credential material never appears in spec, status, logs or Events (ADR-007).
                properties:
                  name:
                    description: Name of the referenced secret (type kubernetes.io/dockerconfigjson).
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              stream:
                description: Stream is the target ImageStream name in the same namespace
                  as this task.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                type: string
              tag:
                description: |-
                  Tag to associate the pushed image with on the target stream. Retag is done
                  by writing a new Mapping for the existing digest (ADR-002 R9); there is no
                  other mutation path.
                maxLength: 128
                minLength: 1
                pattern: ^[a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}$
                type: string
            required:
            - image
            - stream
            - tag
            type: object
          status:
            description: |-
              ImageStreamMappingStatus reports the registration result. Controller-owned
              through the status subresource. Registering the same (stream, tag, digest)
              again is an idempotent no-op success and produces no duplicate Image Change
              (ADR-004, user story 16).
            properties:
              artifactRef:
                description: |-
                  ArtifactRef is the name of the cluster-scoped ImageArtifact created or
                  reused for the digest (sha256-<64hex>).
                maxLength: 253
                type: string
              completedAt:
                description: |-
                  CompletedAt is when the task reached its terminal state (success or
                  failure). TTL garbage collection counts from this timestamp (ADR-004).
                format: date-time
                type: string
              conditions:
                description: |-
                  Conditions of the task, keyed by type. The terminal condition is
                  Complete=True with reason Succeeded or Failed and a diagnosable message.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              digest:
                description: Digest normalized from spec.image, sha256:<64hex>.
                pattern: ^sha256:[0-9a-f]{64}$
                type: string
              startedAt:
                description: StartedAt is when the controller began processing the
                  task.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
