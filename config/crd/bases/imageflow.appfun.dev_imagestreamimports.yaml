---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.15.0
  name: imagestreamimports.imageflow.appfun.dev
spec:
  group: imageflow.appfun.dev
  names:
    kind: ImageStreamImport
    listKind: ImageStreamImportList
    plural: imagestreamimports
    singular: imagestreamimport
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.stream
      name: Stream
      type: string
    - jsonPath: .spec.tag
      name: Tag
      type: string
    - jsonPath: .status.conditions[?(@.type=="Complete")].status
      name: Complete
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ImageStreamImport is a short-lived task CRD that pulls image metadata from an
          external registry into the catalog (ADR-002 R6, ADR-004). On success the
          controller records an ImageArtifact and the (stream, tag) association; completed
          tasks are TTL garbage collected (success 1h / failure 24h, controller flags) and
          audited via Events. ImageFlow never pushes and never stores blobs (ADR-007).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ImageStreamImportSpec is the import request (pull path, ADR-004): read image
              metadata from an external registry through the standard OCI / Docker Registry v2
              API only (ADR-007) and register it onto (stream, tag). Tasks are created
              on-demand by users or periodically by the scheduled-import controller.
            properties:
              from:
                description: |-
                  From is the external image reference to import (registry reachable through
                  the OCI v2 API, subject to the controller registry allowlist, ADR-007).
                properties:
                  kind:
                    default: DockerImage
                    description: Kind of the image source. v1 supports DockerImage
                      only.
                    enum:
                    - DockerImage
                    type: string
                  name:
                    description: |-
                      Name is the full external image reference, e.g. quay.io/team/app:stable or
                      quay.io/team/app@sha256:<64hex>. Tag references are required for scheduled
                      imports so tag drift can be detected (digest references cannot drift).
                    maxLength: 2048
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              pullSecretRef:
                description: |-
                  PullSecretRef optionally references a dockerconfigjson secret in the same
                  namespace used to authenticate against the registry. Credential material
                  never appears in spec, status, logs or Events (ADR-007, user story 12).
                properties:
                  name:
                    description: Name of the referenced secret (type kubernetes.io/dockerconfigjson).
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              stream:
                description: Stream is the target ImageStream name in the same namespace
                  as this task.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                type: string
              tag:
                description: Tag to associate the imported image with on the target
                  stream.
                maxLength: 128
                minLength: 1
                pattern: ^[a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}$
                type: string
            required:
            - from
            - stream
            - tag
            type: object
          status:
            description: |-
              ImageStreamImportStatus reports the import result with diagnosable reasons
              (network, credentials, manifest problems — user story 11). Controller-owned
              through the status subresource.
            properties:
              artifactRef:
                description: |-
                  ArtifactRef is the name of the cluster-scoped ImageArtifact created or
                  reused for the resolved digest (sha256-<64hex>).
                maxLength: 253
                type: string
              completedAt:
                description: |-
                  CompletedAt is when the task reached its terminal state (success or
                  failure). TTL garbage collection counts from this timestamp (ADR-004).
                format: date-time
                type: string
              conditions:
                description: |-
                  Conditions of the task, keyed by type. The terminal condition is
                  Complete=True with reason Succeeded or Failed and a diagnosable message.
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              digest:
                description: Digest resolved from the external reference, sha256:<64hex>.
                pattern: ^sha256:[0-9a-f]{64}$
                type: string
              imageReference:
                description: |-
                  ImageReference is the resolved canonical digest reference
                  <repo>@sha256:<64hex>.
                pattern: ^[^@\s]+@sha256:[0-9a-f]{64}$
                type: string
              startedAt:
                description: StartedAt is when the controller began processing the
                  task.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
