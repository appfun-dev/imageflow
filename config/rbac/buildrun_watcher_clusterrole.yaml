# BuildRun Watcher RBAC (T1, ADR-004 Amended + ADR-011):
# Feature-gated ClusterRole granting read access to Shipwright BuildRuns
# plus status patch for condition updates. Only bound when
# --enable-buildrun-watcher=true is set on the manager deployment.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: imageflow-buildrun-watcher
rules:
  - apiGroups: ["shipwright.io"]
    resources: ["buildruns"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["shipwright.io"]
    resources: ["buildruns/status"]
    verbs: ["patch"]
