---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - imageflow.appfun.dev
  resources:
  - imageartifacts
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - imageflow.appfun.dev
  resources:
  - imagestreamimports
  - imagestreammappings
  verbs:
  - delete
  - get
  - list
  - watch
- apiGroups:
  - imageflow.appfun.dev
  resources:
  - imagestreammappings/status
  - imagestreams/status
  - imagestreamtags/status
  - imagetags/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - imageflow.appfun.dev
  resources:
  - imagestreams
  - imagesubscriptions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - imageflow.appfun.dev
