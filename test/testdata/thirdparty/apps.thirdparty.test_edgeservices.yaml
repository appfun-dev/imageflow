apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: edgeservices.apps.thirdparty.test
spec:
  group: apps.thirdparty.test
  names:
    kind: EdgeService
    listKind: EdgeServiceList
    plural: edgeservices
    singular: edgeservice
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # Plain string image field — direct-path write shape.
                edgeImage:
                  type: string
                runtime:
                  type: object
                  properties:
                    # Non-string leaf — proves the explicit Condition path.
                    size:
                      type: integer
                    # Declared but left unset on live objects — the
                    # missing-leaf violation shape.
                    initImage:
                      type: string
                    # Stable-key array — x-kubernetes-list-type: map keyed
                    # on name so SSA merges (and owns) per element; this
                    # is the shape imageFields array filters require.
                    containers:
                      type: array
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys:
                        - name
                      items:
                        type: object
                        required:
                          - name
                        properties:
                          name:
                            type: string
                          image:
                            type: string
                          mode:
                            type: string
                legacy:
                  type: object
                  properties:
                    # Default (atomic) list type — element-level SSA is
                    # impossible here, so the resolver's atomic-list guard
                    # must refuse filtered paths instead of clobbering
                    # sibling elements.
                    images:
                      type: array
                      x-kubernetes-list-type: atomic
                      items:
                        type: object
                        required:
                          - name
                        properties:
                          name:
                            type: string
                          image:
                            type: string
            status:
              type: object
              properties:
                # System-owned root — the resolver must refuse writes here
                # (status subresource; a main-resource apply would drop it).
                phase:
                  type: string
