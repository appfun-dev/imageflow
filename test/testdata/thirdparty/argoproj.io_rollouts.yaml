# Minimal structural Argo Rollouts CRD for the envtest lane (v1.8-01, issue
# #92, ADR-015). NOT the upstream CRD — only the shape the delivery engine
# touches: the standard pod-template nest .spec.template.spec.containers as a
# map-list keyed on name so real Server-Side Apply merges (and owns) per
# element, plus a status subresource. The lane installs this CRD WITHOUT any
# rollouts-controller running, proving the admission + SSA write path on a
# cluster where the kind exists but its controller does not.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rollouts.argoproj.io
spec:
  group: argoproj.io
  names:
    kind: Rollout
    listKind: RolloutList
    plural: rollouts
    singular: rollout
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                selector:
                  type: object
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                strategy:
                  type: object
                  properties:
                    canary:
                      type: object
                      properties:
                        maxSurge:
                          type: string
                template:
                  type: object
                  properties:
                    metadata:
                      type: object
                      properties:
                        labels:
                          type: object
                          additionalProperties:
                            type: string
                    spec:
                      type: object
                      properties:
                        # Stable-key array — x-kubernetes-list-type: map keyed
                        # on name so SSA merges (and owns) per element; this
                        # is the shape the pod-template Kind adapter writes.
                        containers:
                          type: array
                          x-kubernetes-list-type: map
                          x-kubernetes-list-map-keys:
                            - name
                          items:
                            type: object
                            required:
                              - name
                            properties:
                              name:
                                type: string
                              image:
                                type: string
            status:
              type: object
              properties:
                # System-owned root — the rollouts-controller would write
                # here; a main-resource SSA apply must not drop it.
                phase:
                  type: string
                currentPodHash:
                  type: string
