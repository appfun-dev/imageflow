# Minimal structural Argo Rollouts CRD for the envtest lanes (v1.8-01 #92 /
# v1.8-02 #93, ADR-015). NOT the upstream CRD — only the shapes ImageFlow
# touches, merged from both lanes' requirements:
#
#   - .spec.template.spec.containers as a name-keyed map-list so real
#     Server-Side Apply merges (and owns) per element — the shape the
#     pod-template Kind adapter writes (v1.8-01 delivery lane);
#   - .spec.replicas / .spec.selector / .spec.strategy so the observer's
#     facts extraction and the CR round-trip through admission survive;
#   - a declared .status shape (observedGeneration is a STRING upstream,
#     phase / stableRS / currentPodHash / pauseConditions[] / replica counts)
#     plus the status subresource, so the observer lane can hand-write status
#     through /status exactly the way the rollouts-controller would (v1.8-02).
#
# The lanes install this CRD WITHOUT any rollouts-controller running: the
# delivery lane proves the admission + SSA write path, the observer lane
# proves the status read + determination path — each on a cluster where the
# kind exists but its controller does not.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rollouts.argoproj.io
spec:
  group: argoproj.io
  scope: Namespaced
  names:
    kind: Rollout
    listKind: RolloutList
    plural: rollouts
    singular: rollout
    shortNames:
      - ro
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                selector:
                  type: object
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                strategy:
                  type: object
                  properties:
                    canary:
                      type: object
                      properties:
                        maxSurge:
                          type: string
                template:
                  type: object
                  properties:
                    metadata:
                      type: object
                      properties:
                        labels:
                          type: object
                          additionalProperties:
                            type: string
                    spec:
                      type: object
                      properties:
                        # Stable-key array — x-kubernetes-list-type: map keyed
                        # on name so SSA merges (and owns) per element; this
                        # is the shape the pod-template Kind adapter writes.
                        containers:
                          type: array
                          x-kubernetes-list-type: map
                          x-kubernetes-list-map-keys:
                            - name
                          items:
                            type: object
                            required:
                              - name
                            properties:
                              name:
                                type: string
                              image:
                                type: string
            status:
              type: object
              properties:
                # System-owned root — the rollouts-controller would write
                # here; a main-resource SSA apply must not drop it.
                observedGeneration:
                  type: string
                phase:
                  type: string
                stableRS:
                  type: string
                currentPodHash:
                  type: string
                pauseConditions:
                  type: array
                  items:
                    type: object
                    properties:
                      reason:
                        type: string
                replicas:
                  type: integer
                updatedReplicas:
                  type: integer
                readyReplicas:
                  type: integer
                availableReplicas:
                  type: integer
