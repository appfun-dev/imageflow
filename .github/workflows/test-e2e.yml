name: E2E Tests

on:
  push:
  pull_request:

jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      # ADR-015 decision 15 / spec v1.8 D11: the kind e2e lane asserts the
      # closed loop with the REAL rollouts-controller, so the cluster must
      # exist before the pinned install manifest is applied (setup-test-e2e
      # is idempotent; `make test-e2e` below re-runs it as a no-op).
      - name: Create the kind cluster
        run: make setup-test-e2e

      # Preload every image the e2e lanes run as a pod, so cold registry
      # pulls inside kind cannot stall rollout convergence (pause:3.9 pulls
      # exceeded 5m in CI more than once; #97). Keep this list in sync with
      # the image constants in test/e2e/. The cluster name matches
      # KIND_CLUSTER in the Makefile.
      - name: Preload workload images into kind
        run: |
          set -euo pipefail
          for img in \
            registry.k8s.io/pause:3.9 \
            docker.io/library/busybox:1.36.1 \
            docker.io/library/registry:2.8.3 \
            quay.io/argoproj/argo-rollouts:v1.10.2; do
            docker pull "$img"
            kind load docker-image "$img" --name imageflow-test-e2e
          done

      - name: Install Argo Rollouts (pinned stable, ADR-015)
        run: |
          kubectl create namespace argo-rollouts
          kubectl create -n argo-rollouts -f https://github.com/argoproj/argo-rollouts/releases/download/v1.10.2/install.yaml
          kubectl rollout status deployment/argo-rollouts -n argo-rollouts --timeout=180s

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e
